name: Release

on:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

  build-and-upload:
    name: Build & Upload Assets
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}

      - name: Verify plugin
        run: ./gradlew verifyPlugin
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          # Extract notes for this version from CHANGELOG.md
          VERSION="${{ needs.semantic-release.outputs.new_release_version }}"
          # Get content between this version header and the next version header
          NOTES=$(awk "/^## \[?${VERSION}\]?/{found=1; next} /^## \[?[0-9]+\./{if(found) exit} found{print}" CHANGELOG.md)
          # Save to file for gh release
          echo "$NOTES" > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.semantic-release.outputs.new_release_git_tag }} \
            build/distributions/*.zip \
            --title "v${{ needs.semantic-release.outputs.new_release_version }}" \
            --notes-file release-notes.md

      # Uncomment to enable JetBrains Marketplace publishing
      # Requires JETBRAINS_TOKEN secret (get from https://plugins.jetbrains.com/author/me/tokens)
      # - name: Publish to JetBrains Marketplace
      #   run: ./gradlew publishPlugin
      #   env:
      #     JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
      #     VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
